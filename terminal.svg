<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="554" viewBox="0 0 760 554" role="img" aria-label="Terminal window: kiwi@kittwn. JC student exploring computing, research and cybersecurity. Currently researching inference attacks on a biodiversity citizen science platform and building Eos Initiative." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A494E5"/>
      <stop offset="1" stop-color="#E5A494"/>
    </linearGradient>
    <linearGradient id="accentText" gradientUnits="userSpaceOnUse" x1="28" y1="0" x2="440" y2="0">
      <stop offset="0" stop-color="#A494E5"/>
      <stop offset="1" stop-color="#E5A494"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A2435"/>
      <stop offset="1" stop-color="#242635"/>
    </linearGradient>
    <clipPath id="win"><rect x="0" y="0" width="760" height="554" rx="14"/></clipPath>
  </defs>

  <style>
    text { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'Courier New', monospace; font-size: 13px; fill: #FFE3DE; white-space: pre; }
    .b  { font-weight: 700; }
    .pu { fill: #A494E5; }
    .pe { fill: #E5A494; }
    .go { fill: #EAC07D; }
    .gl { fill: #F9DC8C; }
    .co { fill: #FBA498; }
    .mu { fill: #7B6E96; }
    .hint { fill: #D2C2BF; opacity: .75; }
    .lk { fill: #EDC4B7; }
    .row { animation: in .45s ease-out backwards; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .d0 { animation-delay: .1s } .d1 { animation-delay: .45s } .d2 { animation-delay: .8s }
    .d3 { animation-delay: 1.15s } .d4 { animation-delay: 1.5s } .d5 { animation-delay: 1.85s }
    .d6 { animation-delay: 2.2s } .d7 { animation-delay: 2.55s }
    .cursor { fill: #F7D1BA; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 55% { fill: #F7D1BA } 56%, 100% { fill: #353844 } }
  </style>

  <!-- window -->
  <g clip-path="url(#win)">
    <rect width="760" height="554" fill="#353844"/>
    <rect width="760" height="38" fill="url(#bar)"/>
    <rect y="38" width="760" height="1" fill="#7B6E96" opacity=".35"/>
  </g>
  <rect x="1.6" y="1.6" width="756.8" height="550.8" rx="13" fill="none" stroke="url(#accent)" stroke-width="3.2"/>

  <circle cx="26" cy="19" r="6" fill="#E5A494"/>
  <circle cx="46" cy="19" r="6" fill="#EAC07D"/>
  <circle cx="66" cy="19" r="6" fill="#A494E5"/>
  <text x="380" y="23" text-anchor="middle" class="mu" style="font-size:12px">kiwi@kittwn: ~</text>

  <!-- banner -->
  <text class="row d0 b" x="28" y="68" fill="url(#accentText)" style="fill:url(#accentText)">thanks for visiting my lil corner of the internet!!! :D</text>

  <!-- neofetch -->
  <text class="row d1" x="28" y="100"><tspan class="pu b">kiwi@kittwn</tspan><tspan class="mu">:</tspan><tspan class="pe">~</tspan><tspan> $ </tspan><tspan class="gl">neofetch</tspan></text>

  <g class="row d2">
    <text x="28" y="130" class="b"><tspan class="pu">kiwi</tspan><tspan class="mu">@</tspan><tspan class="pe">kittwn</tspan></text>
    <text x="28" y="146" class="mu">───────────</text>
    <text x="28" y="172" class="pu b">who</text>   <text x="92" y="172">JC student, figuring out the future (◕‿◕)</text>
    <text x="28" y="193" class="pu b">into</text>  <text x="92" y="193">computing · research · cybersecurity</text>
    <text x="28" y="214" class="pu b">stack</text> <text x="92" y="214">js · html · css · node · python</text>
    <text x="28" y="235" class="pu b">learn</text> <text x="92" y="235">always deepening my knowledge</text>
    <rect x="28"  y="252" width="16" height="12" rx="3" fill="#A494E5"/>
    <rect x="48"  y="252" width="16" height="12" rx="3" fill="#E5A494"/>
    <rect x="68"  y="252" width="16" height="12" rx="3" fill="#EAC07D"/>
    <rect x="88"  y="252" width="16" height="12" rx="3" fill="#FBA498"/>
    <rect x="108" y="252" width="16" height="12" rx="3" fill="#7B6E96"/>
    <rect x="128" y="252" width="16" height="12" rx="3" fill="#FFE3DE"/>
  </g>

  <!-- currently -->
  <text class="row d3" x="28" y="298"><tspan class="pu b">kiwi@kittwn</tspan><tspan class="mu">:</tspan><tspan class="pe">~</tspan><tspan> $ </tspan><tspan class="gl">cat currently.txt</tspan></text>
  <g class="row d4">
    <text x="28" y="322" class="go b">[1]</text>
    <text x="62" y="322">researching <tspan class="pe b">inference attacks</tspan> on a biodiversity citizen science platform</text>
    <text x="62" y="343" class="hint">↳ ur interested or wanna give ur thoughts? do reach out!</text>
    <text x="28" y="367" class="go b">[2]</text>
    <text x="62" y="367">building <tspan class="pe b">Eos Initiative</tspan> — by girls, for girls</text>
    <text x="62" y="388" class="hint">↳ inspiring girls to explore computing</text>
  </g>

  <!-- connect -->
  <text class="row d5" x="28" y="424"><tspan class="pu b">kiwi@kittwn</tspan><tspan class="mu">:</tspan><tspan class="pe">~</tspan><tspan> $ </tspan><tspan class="gl">ls ./connect</tspan></text>
  <g class="row d6">
    <text x="28" y="448" class="pu b">mail</text> <text x="80" y="448" class="lk">contact@kiwikittwn.space</text>
    <text x="28" y="469" class="pu b">blog</text> <text x="80" y="469" class="lk">kiwikittwn.space</text>
    <text x="28" y="490" class="pu b">eos</text>  <text x="80" y="490" class="lk">eos-initiative.com</text>
  </g>

  <!-- idle prompt -->
  <g class="row d7">
    <text x="28" y="526"><tspan class="pu b">kiwi@kittwn</tspan><tspan class="mu">:</tspan><tspan class="pe">~</tspan><tspan> $ </tspan><tspan class="cursor">█</tspan></text>
  </g>
</svg>
